</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">Actual CI flow in .github/workflows/ci.yml</title><desc id="pele-desc">On a push to main or a pull request to main, two test jobs run first. The live scan job then runs even if they failed, scans both modes, writes provenance, checks redaction, uploads sanitized evidence, and ends with an evidence gate.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_trigger_lint_0"><path d="M217.41,88C217.41,105.5 131.84,105.5 131.84,123L131.84,129"/><path class="pele-marker" d="M131.84,136L128.48,128L135.2,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_trigger_c312_0"><path d="M289.03,88C289.03,105.5 374.6,105.5 374.6,123L374.6,129"/><path class="pele-marker" d="M374.6,136L371.24,128L377.96,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_lint_live_0"><path d="M131.84,208L131.84,249"/><path class="pele-marker" d="M131.84,256L128.48,248L135.2,248Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_c312_live_0"><path d="M374.6,208L374.6,249"/><path class="pele-marker" d="M374.6,256L371.24,248L377.96,248Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_live_ev_0"><path d="M253.22,376L253.22,417"/><path class="pele-marker" d="M253.22,424L249.86,416L256.58,416Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ev_gate_0"><path d="M253.22,496L253.22,537"/><path class="pele-marker" d="M253.22,544L249.86,536L256.58,536Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="trigger" transform="translate(253.22,52)"><rect x="-87.81" y="-36" width="175.62" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Push to main or</tspan><tspan x="0" y="17.6">pull request to main</tspan></text></g><g class="pele-node pele-shape-rect" data-id="lint" transform="translate(131.84,172)"><rect x="-115.84" y="-36" width="231.68" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">lint-and-test</tspan><tspan x="0" y="17.6">ruff and pytest, Python 3.11</tspan></text></g><g class="pele-node pele-shape-rect" data-id="c312" transform="translate(374.6,172)"><rect x="-86.92" y="-36" width="173.84" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">python-312-compat</tspan><tspan x="0" y="17.6">pytest, Python 3.12</tspan></text></g><g class="pele-node pele-shape-rect" data-id="live" transform="translate(253.22,316)"><rect x="-158.06" y="-60" width="316.11" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">live-security-scan</tspan><tspan x="0" y="-6.4">runs even if a test job failed</tspan><tspan x="0" y="17.6">:8000 VULNERABLE: start, scan, verify</tspan><tspan x="0" y="41.6">:8001 HARDENED: start, scan, verify</tspan></text></g><g class="pele-node pele-shape-rect" data-id="ev" transform="translate(253.22,460)"><rect x="-126.94" y="-36" width="253.87" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Provenance, redaction check,</tspan><tspan x="0" y="17.6">upload scan-evidence (7 days)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="gate" transform="translate(253.22,580)"><rect x="-136.27" y="-36" width="272.54" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Evidence gate</tspan><tspan x="0" y="17.6">fails unless every part succeeded</tspan></text></g></g></svg>
