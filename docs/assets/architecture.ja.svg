</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">Web Security Control Lab の全体構成</title><desc id="pele-desc">学習者とホスト側のスキャナーは、ローカルHTTPで1つのFastAPI対象アプリに接続します。SQLiteはアプリのプロセス内にあります。アプリはホストのuvicornか、docker composeの唯一のwebサービスとして起動します。</desc><g class="pele-clusters"><g class="pele-cluster" data-id="host"><rect x="16" y="16" width="736.53" height="461" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="141.57" y="41.6" text-anchor="middle">学習者のマシン（localhostのみ）</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_learner_app_0"><path d="M105.56,176L105.56,215.5C105.56,219.78 216,222.09 216,226.38L216,230"/><path class="pele-marker" d="M216,237L212.64,229L219.36,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scanner_app_0"><path d="M330.46,176L330.46,230"/><path class="pele-marker" d="M330.46,237L327.1,229L333.82,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_start_app_0"><path d="M609.17,176L609.17,215.5C609.17,218.38 444.93,223.49 444.93,226.38L444.93,230" stroke-dasharray="3 4"/><path class="pele-marker" d="M444.93,237L441.57,229L448.29,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_app_db_0"><path d="M330.46,333L330.46,362"/><path class="pele-marker" d="M330.46,369L327.1,361L333.82,361Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_learner_app_0"><rect x="52.15" y="192.5" width="106.83" height="21" rx="3" fill="var(--_bg)"/><text x="105.56" y="207.9" text-anchor="middle">HTTP 127.0.0.1</text></g><g class="pele-edge-label" data-id="L_scanner_app_0"><rect x="245.19" y="192.5" width="170.55" height="21" rx="3" fill="var(--_bg)"/><text x="330.46" y="207.9" text-anchor="middle">HTTP、ローカル対象のみ</text></g><g class="pele-edge-label" data-id="L_start_app_0"><rect x="591.17" y="192.5" width="36" height="21" rx="3" fill="var(--_bg)"/><text x="609.17" y="207.9" text-anchor="middle">起動</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="learner" transform="translate(105.56,140)"><rect x="-77.56" y="-36" width="155.12" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">学習者</tspan><tspan x="0" y="17.6">ブラウザー / curl</tspan></text></g><g class="pele-node pele-shape-rect" data-id="scanner" transform="translate(330.46,128)"><rect x="-127.34" y="-48" width="254.69" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">ホスト上のスキャナーCLI</tspan><tspan x="0" y="5.6">security-lab scan</tspan><tspan x="0" y="29.6">HTTPのみ。SQLiteは開かない</tspan></text></g><g class="pele-node pele-shape-rect" data-id="start" transform="translate(609.17,116)"><rect x="-131.36" y="-60" width="262.72" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">どちらかで起動</tspan><tspan x="0" y="-6.4">ホストのuvicorn、または</tspan><tspan x="0" y="17.6">docker composeのwebサービス</tspan><tspan x="0" y="41.6">（唯一のコンテナ）</tspan></text></g><g class="pele-node pele-shape-rect" data-id="app" transform="translate(330.46,285)"><rect x="-166.46" y="-48" width="332.93" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">対象アプリ: FastAPI（app/）</tspan><tspan x="0" y="5.6">1プロセス、起動ごとに1つのLAB_MODE</tspan><tspan x="0" y="29.6">ルート、ヘッダーMiddleware、認証</tspan></text></g><g class="pele-node pele-shape-cyl" data-id="db" transform="translate(330.46,417)"><path d="M-122.46,-36A122.46,12 0 0 1 122.46,-36V36A122.46,12 0 0 1 -122.46,36Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-122.46,-36A122.46,12 0 0 0 122.46,-36" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-0.4">アプリのプロセス内のSQLite</tspan><tspan x="0" y="23.6">既定はインメモリ</tspan></text></g></g></svg>
