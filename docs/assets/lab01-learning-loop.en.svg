</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">LAB-01 learning loop</title><desc id="pele-desc">Six steps for the LAB-01 exercise: predict, observe in VULNERABLE, explain the cause, repair, reverify in HARDENED, and state the limits. The worked solution is kept in a separate file.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_predict_observe_0"><path d="M145.16,112L145.16,153"/><path class="pele-marker" d="M145.16,160L141.8,152L148.52,152Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_observe_explain_0"><path d="M145.16,256L145.16,297"/><path class="pele-marker" d="M145.16,304L141.8,296L148.52,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_explain_repair_0"><path d="M145.16,376L145.16,417"/><path class="pele-marker" d="M145.16,424L141.8,416L148.52,416Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_repair_reverify_0"><path d="M145.16,520L145.16,561"/><path class="pele-marker" d="M145.16,568L141.8,560L148.52,560Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_reverify_limits_0"><path d="M145.16,664L145.16,705"/><path class="pele-marker" d="M145.16,712L141.8,704L148.52,704Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="predict" transform="translate(145.16,64)"><rect x="-105.59" y="-48" width="211.18" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">1 Predict</tspan><tspan x="0" y="5.6">who may open /admin?</tspan><tspan x="0" y="29.6">anonymous, user, admin</tspan></text></g><g class="pele-node pele-shape-rect" data-id="observe" transform="translate(145.16,208)"><rect x="-123.38" y="-48" width="246.77" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">2 Observe in VULNERABLE</tspan><tspan x="0" y="5.6">role matrix, then the old token</tspan><tspan x="0" y="29.6">after logout</tspan></text></g><g class="pele-node pele-shape-rect" data-id="explain" transform="translate(145.16,340)"><rect x="-105.58" y="-36" width="211.17" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">3 Explain the cause</tspan><tspan x="0" y="17.6">identity is not permission</tspan></text></g><g class="pele-node pele-shape-rect" data-id="repair" transform="translate(145.16,472)"><rect x="-129.16" y="-48" width="258.32" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">4 Repair</tspan><tspan x="0" y="5.6">role check in the admin handler</tspan><tspan x="0" y="29.6">(solution is a separate file)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="reverify" transform="translate(145.16,616)"><rect x="-117.6" y="-48" width="235.2" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">5 Reverify in HARDENED</tspan><tspan x="0" y="5.6">user denied, admin allowed,</tspan><tspan x="0" y="29.6">logged-out token rejected</tspan></text></g><g class="pele-node pele-shape-rect" data-id="limits" transform="translate(145.16,760)"><rect x="-108.27" y="-48" width="216.54" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">6 State the limits</tspan><tspan x="0" y="5.6">six local checks are not</tspan><tspan x="0" y="29.6">proof of production safety</tspan></text></g></g></svg>
