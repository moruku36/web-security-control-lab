name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Pytest
        run: pytest -v

  python-312-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest on Python 3.12
        run: pytest -q

  live-security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify VULNERABLE mode findings
        shell: bash
        run: |
          set -euo pipefail
          LAB_MODE=VULNERABLE uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn-vulnerable.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null

          security-lab scan http://127.0.0.1:8000 --format json > /tmp/vulnerable-scan.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/vulnerable-scan.json").read_text())
          expected = {"high": 1, "medium": 4, "low": 1}
          actual = report["summary"]
          if actual != expected:
              raise SystemExit(f"VULNERABLE scan mismatch: expected={expected}, actual={actual}")
          print(f"VULNERABLE scan verified: {actual}")
          PY

          kill "$PID"
          wait "$PID" || true
          trap - EXIT

      - name: Verify HARDENED mode has zero findings
        shell: bash
        run: |
          set -euo pipefail
          LAB_MODE=HARDENED uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/uvicorn-hardened.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8001/health >/dev/null

          security-lab scan http://127.0.0.1:8001 --format json > /tmp/hardened-scan.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/hardened-scan.json").read_text())
          expected = {"high": 0, "medium": 0, "low": 0}
          actual = report["summary"]
          if actual != expected:
              raise SystemExit(f"HARDENED scan mismatch: expected={expected}, actual={actual}")
          if report["findings"]:
              raise SystemExit(f"HARDENED scan returned findings: {report['findings']}")
          print("HARDENED scan verified: zero findings")
          PY

          kill "$PID"
          wait "$PID" || true
          trap - EXIT
