schema_version: "2020-12"
id: "WSCL-003"
title: "Security Control Remediation and Hardening (Completed)"
description: "Independently verify and harden LAB-01 through LAB-06 while preserving the intentional VULNERABLE teaching mode; validate the HARDENED posture with tests and the local scanner."
phase: 3
dependencies:
  - "WSCL-001"
  - "WSCL-002"
parallelizable: false
role: "reviewer"
repository: "https://github.com/moruku36/web-security-control-lab"
base_ref: "main"
branch: "task/wscl-003-security-remediation"
worktree: "runtime-root/worktrees/wscl-003"
allowed_paths:
  - "app/"
  - "tests/"
prohibited_paths:
  - ".github/"
  - "scanner/"
  - "factory/"
validation:
  - command_id: "ruff"
    timeout_seconds: 120
  - command_id: "pytest"
    timeout_seconds: 300
completion_criteria:
  - id: "CC-1"
    statement: "HARDENED mode scanner reports HIGH=0, MEDIUM=0, LOW=0"
    evidence_type: "test_run"
  - id: "CC-2"
    statement: "VULNERABLE mode remains intentionally detectable as HIGH=1, MEDIUM=4, LOW=1"
    evidence_type: "test_run"
  - id: "CC-3"
    statement: "All unit and integration regression tests pass cleanly"
    evidence_type: "test_run"
  - id: "CC-4"
    statement: "Ruff linter passes without regressions"
    evidence_type: "lint_run"
risk: "high"
approval:
  before_execution: true
  before_merge: true
output_artifacts: []
resources:
  ports:
    - 8000
    - 8001
  test_db: true
  exclusive_keys:
    - "remediation_lock"
permissions:
  - "default"
retry:
  max_attempts: 2
  timeout_minutes: 30
status: "DONE"
state_ref: "state/tasks/WSCL-003.json"
phase_contract:
  target_phase: 3
  preserves:
    - id: "PRSV-01"
      statement: "The educational VULNERABLE mode must remain available after hardening."
      check_type: "required_pattern"
      patterns:
        - "VULNERABLE"
      applies_to:
        - "app/"
    - id: "PRSV-02"
      statement: "The independently verifiable HARDENED mode must remain available."
      check_type: "required_pattern"
      patterns:
        - "HARDENED"
      applies_to:
        - "app/"
