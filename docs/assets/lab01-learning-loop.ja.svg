</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">LAB-01 の学習ループ</title><desc id="pele-desc">LAB-01 演習の6ステップ。予測、VULNERABLEでの観察、原因の説明、修正、HARDENEDでの再検証、限界の説明です。解答例は別ファイルです。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_predict_observe_0"><path d="M154,112L154,153"/><path class="pele-marker" d="M154,160L150.64,152L157.36,152Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_observe_explain_0"><path d="M154,256L154,297"/><path class="pele-marker" d="M154,304L150.64,296L157.36,296Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_explain_repair_0"><path d="M154,376L154,417"/><path class="pele-marker" d="M154,424L150.64,416L157.36,416Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_repair_reverify_0"><path d="M154,520L154,561"/><path class="pele-marker" d="M154,568L150.64,560L157.36,560Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_reverify_limits_0"><path d="M154,664L154,705"/><path class="pele-marker" d="M154,712L150.64,704L157.36,704Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="predict" transform="translate(154,64)"><rect x="-108.23" y="-48" width="216.46" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">1 予測</tspan><tspan x="0" y="5.6">/admin を開けるのは誰か</tspan><tspan x="0" y="29.6">匿名、user、admin</tspan></text></g><g class="pele-node pele-shape-rect" data-id="observe" transform="translate(154,208)"><rect x="-114" y="-48" width="228" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">2 VULNERABLEで観察</tspan><tspan x="0" y="5.6">ロール別の結果と</tspan><tspan x="0" y="29.6">ログアウト後の旧トークン</tspan></text></g><g class="pele-node pele-shape-rect" data-id="explain" transform="translate(154,340)"><rect x="-106" y="-36" width="212" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">3 原因を説明</tspan><tspan x="0" y="17.6">本人確認は権限ではない</tspan></text></g><g class="pele-node pele-shape-rect" data-id="repair" transform="translate(154,472)"><rect x="-138" y="-48" width="276" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">4 修正</tspan><tspan x="0" y="5.6">管理画面ハンドラーのロール検査</tspan><tspan x="0" y="29.6">（解答例は別ファイル）</tspan></text></g><g class="pele-node pele-shape-rect" data-id="reverify" transform="translate(154,616)"><rect x="-114" y="-48" width="228" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">5 HARDENEDで再検証</tspan><tspan x="0" y="5.6">user拒否、admin許可、</tspan><tspan x="0" y="29.6">ログアウト後トークン拒否</tspan></text></g><g class="pele-node pele-shape-rect" data-id="limits" transform="translate(154,760)"><rect x="-110.45" y="-48" width="220.9" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">6 限界を説明</tspan><tspan x="0" y="5.6">ローカルの6検査は本番の</tspan><tspan x="0" y="29.6">安全性の証明ではない</tspan></text></g></g></svg>
