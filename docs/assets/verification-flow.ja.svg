</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">VULNERABLE と HARDENED の検証フロー</title><desc id="pele-desc">アプリをモードごとに1回起動し、security-lab scan で検査します。拒否された対象はリクエスト前に終了コード2で終わります。前提を確立できなければERRORで終了コード3です。それ以外は6つの検査がPASS、FAIL、ERRORを返し、モードごとの期待値と比べます。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_start_scan_0"><path d="M373.13,112L373.13,153"/><path class="pele-marker" d="M373.13,160L369.77,152L376.49,152Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_pre_0"><path d="M320.44,232C320.44,242.25 250.01,242.25 250.01,252.5L250.01,298"/><path class="pele-marker" d="M250.01,305L246.65,297L253.37,297Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_refuse_0"><path d="M425.82,232C425.82,242.25 496.25,242.25 496.25,252.5L496.25,298"/><path class="pele-marker" d="M496.25,305L492.89,297L499.61,297Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pre_err_0"><path d="M185.77,401C185.77,411.25 118.89,411.25 118.89,421.5L118.89,467"/><path class="pele-marker" d="M118.89,474L115.53,466L122.25,466Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pre_checks_0"><path d="M314.25,401C314.25,411.25 381.13,411.25 381.13,421.5L381.13,479"/><path class="pele-marker" d="M381.13,486L377.77,478L384.49,478Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_vul_0"><path d="M313.78,558C313.78,581.5 251.34,581.5 251.34,605L251.34,611"/><path class="pele-marker" d="M251.34,618L247.98,610L254.7,610Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_har_0"><path d="M448.48,558C448.48,587.5 510.91,587.5 510.91,617L510.91,623"/><path class="pele-marker" d="M510.91,630L507.55,622L514.27,622Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_vul_cmp_0"><path d="M251.34,714C251.34,731.5 333.32,731.5 333.32,749L333.32,755"/><path class="pele-marker" d="M333.32,762L329.96,754L336.68,754Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_har_cmp_0"><path d="M510.91,702C510.91,725.5 428.94,725.5 428.94,749L428.94,755"/><path class="pele-marker" d="M428.94,762L425.58,754L432.3,754Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_scan_pre_0"><rect x="183.01" y="254.5" width="134" height="21" rx="3" fill="var(--_bg)"/><text x="250.01" y="269.9" text-anchor="middle">有効なローカルURL</text></g><g class="pele-edge-label" data-id="L_scan_refuse_0"><rect x="478.25" y="254.5" width="36" height="21" rx="3" fill="var(--_bg)"/><text x="496.25" y="269.9" text-anchor="middle">拒否</text></g><g class="pele-edge-label" data-id="L_pre_err_0"><rect x="72.89" y="423.5" width="92" height="21" rx="3" fill="var(--_bg)"/><text x="118.89" y="438.9" text-anchor="middle">確立できない</text></g><g class="pele-edge-label" data-id="L_pre_checks_0"><rect x="342.13" y="423.5" width="78" height="21" rx="3" fill="var(--_bg)"/><text x="381.13" y="438.9" text-anchor="middle">確立できた</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="start" transform="translate(373.13,64)"><rect x="-122.92" y="-48" width="245.84" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">モードごとにアプリを起動</tspan><tspan x="0" y="5.6">VULNERABLE はポート8000</tspan><tspan x="0" y="29.6">HARDENED はポート8001</tspan></text></g><g class="pele-node pele-shape-rect" data-id="scan" transform="translate(373.13,196)"><rect x="-104.69" y="-36" width="209.38" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">security-lab scan URL</tspan><tspan x="0" y="17.6">--expected-mode MODE</tspan></text></g><g class="pele-node pele-shape-rect" data-id="refuse" transform="translate(