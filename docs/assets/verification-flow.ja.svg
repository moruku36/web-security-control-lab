" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">HARDENEDの期待値</tspan><tspan x="0" y="17.6">6 PASS、findings 0</tspan></text></g><g class="pele-node pele-shape-rect" data-id="cmp" transform="translate(381.13,798)"><rect x="-99.81" y="-36" width="199.62" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">期待値と比較</tspan><tspan x="0" y="17.6">（CIはevidence gate）</tspan></text></g></g></svg>
