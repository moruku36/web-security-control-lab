<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 733 493" width="733" height="493" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart" aria-labelledby="pele-title" aria-describedby="pele-desc"><style>
.pele{--pele-bg:#ffffff;--pele-fg:#1f1f1f;--pele-muted:#555555;--pele-line:#444444;--pele-surface:#f3f3f3;--pele-surface-alt:#e6e6e6;--pele-border:#6b6b6b;--pele-accent:#3b5bb5}
@media (prefers-color-scheme: dark){.pele{--pele-bg:#16181d;--pele-fg:#eceff4;--pele-muted:#aab2c0;--pele-line:#aab2c0;--pele-surface:#23272f;--pele-surface-alt:#2e333d;--pele-border:#7b8494;--pele-accent:#8fb0ff}}
</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">Overall structure of Web Security Control Lab</title><desc id="pele-desc">A learner and the host-side scanner both reach one FastAPI target app over local HTTP. SQLite lives inside the app process. The app is started either with uvicorn on the host or as the single web service of docker compose.</desc><g class="pele-clusters"><g class="pele-cluster" data-id="host"><rect x="16" y="16" width="700.18" height="461" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-cluster-label" fill="var(--_m)" x="134.94" y="41.6" text-anchor="middle">Learner machine, localhost only</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_learner_app_0"><path d="M94.01,176L94.01,215.5C94.01,219.72 206.22,222.16 206.22,226.38L206.22,230"/><path class="pele-marker" d="M206.22,237L202.86,229L209.58,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scanner_app_0"><path d="M310.95,176L310.95,230"/><path class="pele-marker" d="M310.95,237L307.59,229L314.31,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_start_app_0"><path d="M583.03,176L583.03,215.5C583.03,218.33 415.68,223.55 415.68,226.38L415.68,230" stroke-dasharray="3 4"/><path class="pele-marker" d="M415.68,237L412.32,229L419.04,229Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_app_db_0"><path d="M310.95,333L310.95,362"/><path class="pele-marker" d="M310.95,369L307.59,361L314.31,361Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_learner_app_0"><rect x="40.6" y="192.5" width="106.83" height="21" rx="3" fill="var(--_bg)"/><text x="94.01" y="207.9" text-anchor="middle">HTTP 127.0.0.1</text></g><g class="pele-edge-label" data-id="L_scanner_app_0"><rect x="232.26" y="192.5" width="157.38" height="21" rx="3" fill="var(--_bg)"/><text x="310.95" y="207.9" text-anchor="middle">HTTP, local targets only</text></g><g class="pele-edge-label" data-id="L_start_app_0"><rect x="561.92" y="192.5" width="42.23" height="21" rx="3" fill="var(--_bg)"/><text x="583.03" y="207.9" text-anchor="middle">starts</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="learner" transform="translate(94.01,140)"><rect x="-66.01" y="-36" width="132.02" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Learner</tspan><tspan x="0" y="17.6">browser / curl</tspan></text></g><g class="pele-node pele-shape-rect" data-id="scanner" transform="translate(310.95,128)"><rect x="-130.94" y="-48" width="261.87" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Scanner CLI on the host</tspan><tspan x="0" y="5.6">security-lab scan</tspan><tspan x="0" y="29.6">HTTP only, never opens SQLite</tspan></text></g><g class="pele-node pele-shape-rect" data-id="start" transform="translate(583.03,116)"><rect x="-121.14" y="-60" width="242.29" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">Started with either</tspan><tspan x="0" y="-6.4">uvicorn on the host, or</tspan><tspan x="0" y="17.6">docker compose service web</tspan><tspan x="0" y="41.6">(the only container)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="app" transform="translate(310.95,285)"><rect x="-156.73" y="-48" width="313.46" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Target app: FastAPI (app/)</tspan><tspan x="0" y="5.6">one process, one LAB_MODE per start</tspan><tspan x="0" y="29.6">routes, header middleware, auth</tspan></text></g><g class="pele-node pele-shape-cyl" data-id="db" transform="translate(310.95,417)"><path d="M-124.72,-36A124.72,12 0 0 1 124.72,-36V36A124.72,12 0 0 1 -124.72,36Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-124.72,-36A124.72,12 0 0 0 124.72,-36" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-0.4">SQLite inside the app process</tspan><tspan x="0" y="23.6">in-memory by default</tspan></text></g></g></svg>
