</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">.github/workflows/ci.yml の実際のCIフロー</title><desc id="pele-desc">mainへのpushまたはmain向けプルリクエストで、まず2つのテストジョブが動きます。ライブスキャンジョブは、それらが失敗しても実行され、両モードを検査し、provenanceを書き、redactionを確認し、サニタイズ済みの証跡をアップロードして、最後にevidence gateで判定します。</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_trigger_lint_0"><path d="M182.08,88C182.08,105.5 125.6,105.5 125.6,123L125.6,129"/><path class="pele-marker" d="M125.6,136L122.24,128L128.96,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_trigger_c312_0"><path d="M308.76,88C308.76,105.5 365.24,105.5 365.24,123L365.24,129"/><path class="pele-marker" d="M365.24,136L361.88,128L368.6,128Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_lint_live_0"><path d="M125.6,208L125.6,249"/><path class="pele-marker" d="M125.6,256L122.24,248L128.96,248Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_c312_live_0"><path d="M365.24,208L365.24,249"/><path class="pele-marker" d="M365.24,256L361.88,248L368.6,248Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_live_ev_0"><path d="M245.42,376L245.42,417"/><path class="pele-marker" d="M245.42,424L242.06,416L248.78,416Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ev_gate_0"><path d="M245.42,496L245.42,537"/><path class="pele-marker" d="M245.42,544L242.06,536L248.78,536Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="trigger" transform="translate(245.42,52)"><rect x="-115.34" y="-36" width="230.67" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">mainへのpush、または</tspan><tspan x="0" y="17.6">main向けのプルリクエスト</tspan></text></g><g class="pele-node pele-shape-rect" data-id="lint" transform="translate(125.6,172)"><rect x="-109.6" y="-36" width="219.2" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">lint-and-test</tspan><tspan x="0" y="17.6">ruffとpytest、Python 3.11</tspan></text></g><g class="pele-node pele-shape-rect" data-id="c312" transform="translate(365.24,172)"><rect x="-90.04" y="-36" width="180.08" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">python-312-compat</tspan><tspan x="0" y="17.6">pytest、Python 3.12</tspan></text></g><g class="pele-node pele-shape-rect" data-id="live" transform="translate(245.42,316)"><rect x="-152.65" y="-60" width="305.3" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">live-security-scan</tspan><tspan x="0" y="-6.4">テストが失敗しても実行</tspan><tspan x="0" y="17.6">:8000 VULNERABLE 起動→検査→検証</tspan><tspan x="0" y="41.6">:8001 HARDENED 起動→検査→検証</tspan></text></g><g class="pele-node pele-shape-rect" data-id="ev" transform="translate(245.42,460)"><rect x="-154.02" y="-36" width="308.05" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">provenance、redaction確認、</tspan><tspan x="0" y="17.6">scan-evidenceをアップロード（7日）</tspan></text></g><g class="pele-node pele-shape-rect" data-id="gate" transform="translate(245.42,580)"><rect x="-114" y="-36" width="228" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Evidence gate</tspan><tspan x="0" y="17.6">すべて成功しない限り失敗</tspan></text></g></g></svg>
