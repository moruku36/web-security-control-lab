</style><rect width="100%" height="100%" fill="var(--pele-bg)"/><title id="pele-title">Verification flow for VULNERABLE and HARDENED modes</title><desc id="pele-desc">The app is started once per mode and scanned with security-lab scan. A refused target exits with 2 before any request. Failed prerequisites give ERROR and exit 3. Otherwise six checks give PASS, FAIL or ERROR, and the results are compared with the expectation for each mode.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_start_scan_0"><path d="M382.34,112L382.34,153"/><path class="pele-marker" d="M382.34,160L378.98,152L385.7,152Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_pre_0"><path d="M329.65,232C329.65,242.25 260.29,242.25 260.29,252.5L260.29,298"/><path class="pele-marker" d="M260.29,305L256.93,297L263.65,297Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_scan_refuse_0"><path d="M435.02,232C435.02,242.25 504.38,242.25 504.38,252.5L504.38,310"/><path class="pele-marker" d="M504.38,317L501.02,309L507.74,309Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pre_err_0"><path d="M204.92,401C204.92,411.25 123.81,411.25 123.81,421.5L123.81,467"/><path class="pele-marker" d="M123.81,474L120.45,466L127.17,466Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pre_checks_0"><path d="M315.67,401C315.67,411.25 396.78,411.25 396.78,421.5L396.78,467"/><path class="pele-marker" d="M396.78,474L393.42,466L400.14,466Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_vul_0"><path d="M323.62,546C323.62,563.5 269.2,563.5 269.2,581L269.2,587"/><path class="pele-marker" d="M269.2,594L265.84,586L272.56,586Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_checks_har_0"><path d="M469.94,546C469.94,569.5 524.35,569.5 524.35,593L524.35,599"/><path class="pele-marker" d="M524.35,606L520.99,598L527.71,598Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_vul_cmp_0"><path d="M269.2,690C269.2,707.5 338.3,707.5 338.3,725L338.3,731"/><path class="pele-marker" d="M338.3,738L334.94,730L341.66,730Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_har_cmp_0"><path d="M524.35,678C524.35,701.5 455.26,701.5 455.26,725L455.26,731"/><path class="pele-marker" d="M455.26,738L451.9,730L458.62,730Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_scan_pre_0"><rect x="209.62" y="254.5" width="101.35" height="21" rx="3" fill="var(--_bg)"/><text x="260.29" y="269.9" text-anchor="middle">valid local URL</text></g><g class="pele-edge-label" data-id="L_scan_refuse_0"><rect x="477.04" y="254.5" width="54.69" height="21" rx="3" fill="var(--_bg)"/><text x="504.38" y="269.9" text-anchor="middle">refused</text></g><g class="pele-edge-label" data-id="L_pre_err_0"><rect x="72.73" y="423.5" width="102.16" height="21" rx="3" fill="var(--_bg)"/><text x="123.81" y="438.9" text-anchor="middle">not established</text></g><g class="pele-edge-label" data-id="L_pre_checks_0"><rect x="357.37" y="423.5" width="78.81" height="21" rx="3" fill="var(--_bg)"/><text x="396.78" y="438.9" text-anchor="middle">established</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="start" transform="translate(382.34,64)"><rect x="-119.39" y="-48" width="238.78" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Start the app once per mode</tspan><tspan x="0" y="5.6">VULNERABLE on port 8000</tspan><tspan x="0" y="29.6">HARDENED on port 8001</tspan></text></g><g class="pele-node pele-shape-rect" data-id="scan" transform="translate(382.34,196)"><rect x="-104.69" y="-36" width="209.38" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">security-lab scan URL</tspan><tspan x="0" y="17.6">--expected-mode MODE</tspan></text></g><g class="pele-node pele-shape-rect" data-id="refuse" transform="translate(504.38,353)"><rect x="-96.71" y="-36" width="193.42" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Target refused</tspan><tspan x="0" y="17.6">exit 2, no request sent</tspan></text></g><g class="pele-node pele-shape-rect" data-id="pre" transform="translate(260.29,353)"><rect x="-107.38" y="-48" width="214.75" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Prerequisites</tspan><tspan x="0" y="5.6">/health service and mode</tspan><tspan x="0" y="29.6">synthetic logins</tspan></text></g><g class="pele-node pele-shape-rect" data-id="err" transform="translate(123.81,510)"><rect x="-107.81" y="-36" width="215.62" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Affected checks: ERROR</tspan><tspan x="0" y="17.6">exit 3, never a pass</tspan></text></g><g class="pele-node pele-shape-rect" data-id="checks" transform="translate(396.78,510)"><rect x="-125.16" y="-36" width="250.32" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Six checks, LAB-01 to LAB-06</tspan><tspan x="0" y="17.6">each PASS, FAIL or ERROR</tspan></text></g><g class="pele-node pele-shape-rect" data-id="vul" transform="translate(269.2,642)"><rect x="-117.58" y="-48" width="235.15" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">VULNERABLE expected</tspan><tspan x="0" y="5.6">6 FAIL</tspan><tspan x="0" y="29.6">HIGH 1, MEDIUM 4, LOW 1</tspan></text></g><g class="pele-node pele-shape-rect" data-id="har" transform="translate(524.35,642)"><rect x="-97.58" y="-36" width="195.15" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">HARDENED expected</tspan><tspan x="0" y="17.6">6 PASS, findings 0</tspan></text></g><g class="pele-node pele-shape-rect" data-id="cmp" transform="translate(396.78,774)"><rect x="-110.48" y="-36" width="220.96" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Compare with expectation</tspan><tspan x="0" y="17.6">(CI evidence gate)</tspan></text></g></g></svg>
